{% extends 'layouts/base.html' %}

{% block title %}Editar Grupo | Gestor de Proyectos{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <!-- Encabezado con botón de regreso -->
    <div class="flex items-center gap-4 mb-6">
        <a href="{% url 'grupos' %}" class="p-2 text-theme-beige-300 hover:text-theme-beige-500 hover:bg-theme-black-800 rounded-lg transition-colors" title="Volver a grupos">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-theme-beige-100 flex items-center gap-3">
                Editar Grupo
            </h1>
            <p class="text-sm text-theme-beige-300 mt-1">
                Modificando el grupo: <span class="font-semibold text-theme-beige-100">{{ grupo.name }}</span>
            </p>
        </div>
    </div>

    <!-- Tarjeta del formulario de edición -->
    <div class="bg-theme-black-900 rounded-xl shadow-lg shadow-black/20 border border-theme-black-800 p-6 sm:p-8">
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="nombre" class="block text-sm font-medium text-theme-beige-300 mb-2">
                    Nombre del grupo
                </label>
                <!-- El atributo value="{{ grupo.name }}" pre-carga el nombre actual -->
                <input type="text" 
                       name="nombre" 
                       id="nombre" 
                       value="{{ grupo.name }}" 
                       required 
                       maxlength="150" 
                       class="w-full px-4 py-3 text-sm bg-theme-black-950 border border-theme-black-700 text-theme-beige-100 rounded-lg focus:outline-none focus:border-theme-beige-500 focus:ring-1 focus:ring-theme-beige-500 transition-all placeholder-theme-black-700/50"
                       autocomplete="off">
            </div>
            
            <!-- Botones de acción -->
            <div class="flex items-center gap-3 pt-4 border-t border-theme-black-800">
                <button type="submit" 
                        class="inline-flex items-center gap-2 px-6 py-2.5 text-sm font-medium text-theme-black-950 bg-theme-beige-500 hover:bg-theme-beige-300 rounded-lg transition-all shadow-sm hover:shadow">
                    <!-- Icono de Guardar -->
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16.5 3.75V16.5L12 14.25 7.5 16.5V3.75m9 0H18A2.25 2.25 0 0 1 20.25 6v12A2.25 2.25 0 0 1 18 20.25H6A2.25 2.25 0 0 1 3.75 18V6A2.25 2.25 0 0 1 6 3.75h1.5m9 0h-9" />
                    </svg>
                    Guardar cambios
                </button>
                
                <a href="{% url 'grupos' %}" 
                   class="inline-flex items-center px-6 py-2.5 text-sm font-medium text-theme-beige-300 bg-theme-black-900 border border-theme-black-700 hover:bg-theme-black-800 hover:text-theme-beige-100 rounded-lg transition-all">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
