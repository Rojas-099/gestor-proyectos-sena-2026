{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro · Gestor de Proyectos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'theme-black': {
                950: '#050505',
                900: '#121212',
                800: '#1f1f1f',
                700: '#2e2e2e',
              },
              'theme-beige': {
                500: '#d4c4a8',
                300: '#e8ddc8',
                100: '#fdfbf7',
              },
            }
          }
        }
      }
    </script>
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
        .register-card {
            transition: box-shadow 0.15s ease, transform 0.1s ease;
        }
        input {
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .btn-primary {
            transition: all 0.15s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(0px);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-message {
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen bg-theme-black-950 text-theme-beige-100 font-['Space_Grotesk'] relative flex flex-col items-center justify-start py-12 px-4 sm:px-6">

    <!-- Filtro SVG Oculto para teñir el logo -->
    <svg class="hidden">
        <filter id="rimuru-beige">
            <feColorMatrix type="matrix" values="
            0 0 0 0 0.831
            0 0 0 0 0.768
            0 0 0 0 0.658
            -0.333 -0.333 -0.333 0 1
            " />
        </filter>
    </svg>

    <!-- Luces de fondo sutiles fijas -->
    <div class="pointer-events-none fixed -top-40 -left-32 w-[32rem] h-[32rem] bg-theme-beige-500/5 rounded-full blur-[120px]"></div>
    <div class="pointer-events-none fixed top-1/3 -right-40 w-[28rem] h-[28rem] bg-theme-black-700/20 rounded-full blur-[120px]"></div>
    <div class="pointer-events-none fixed bottom-0 left-1/4 w-[26rem] h-[26rem] bg-theme-beige-500/5 rounded-full blur-[130px]"></div>

    <!-- Textura sutil de grano -->
    <div class="pointer-events-none fixed inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(212,196,168,0.03)_1px,transparent_0)] bg-[size:24px_24px]"></div>

    <main class="w-full max-w-lg relative z-10 my-auto">
        <!-- Tarjeta de registro de cristal -->
        <div class="register-card rounded-3xl bg-theme-black-900/80 backdrop-blur-2xl border border-theme-black-800 shadow-2xl shadow-black/80 px-6 py-8 md:p-10">
            
            <!-- Logo y título -->
            <div class="text-center mb-8">
                <div class="w-20 h-20 rounded-2xl bg-theme-black-900 shadow-[0_0_35px_-5px_rgba(212,196,168,0.2)] flex items-center justify-center border border-theme-beige-500/30 overflow-hidden mx-auto mb-4">
                    <img src="{% static 'img/logo.png' %}" alt="Logo" class="w-full h-full object-cover scale-110 opacity-90 hover:opacity-100 transition-opacity" style="filter: url(#rimuru-beige);">
                </div>
                <h1 class="text-2xl sm:text-3xl font-semibold text-theme-beige-100 tracking-tight">Crear cuenta</h1>
                <p class="text-sm text-theme-beige-300/70 mt-1">Regístrate para comenzar a gestionar tus proyectos</p>
            </div>

            {% if errors %}
                <div class="error-message mb-6 rounded-xl border border-theme-black-700 bg-theme-black-800 text-theme-beige-300 text-sm px-4 py-3">
                    <ul class="list-disc list-inside space-y-1">
                        {% for error in errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}

            <!-- Formulario de registro -->
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <!-- Campo: Usuario -->
                <div class="space-y-1.5">
                    <label for="username" class="text-xs font-medium text-theme-beige-300/70 flex items-center gap-2 ml-1">
                        <i class="fa-solid fa-user text-theme-beige-500"></i>
                        Usuario
                    </label>
                    <input 
                        type="text" 
                        name="username" 
                        id="username"
                        value="{{ datos.username|default:'' }}"
                        required
                        placeholder="Ej. juan123"
                        class="w-full px-4 py-3 bg-theme-black-950 border border-theme-black-700 rounded-xl text-theme-beige-100 placeholder:text-theme-beige-300/30 outline-none focus:bg-theme-black-950 focus:border-theme-beige-500 focus:ring-4 focus:ring-theme-beige-500/20 transition-all text-sm"
                    >
                </div>

                <!-- Campo: Nombre -->
                <div class="space-y-1.5">
                    <label for="first_name" class="text-xs font-medium text-theme-beige-300/70 flex items-center gap-2 ml-1">
                        <i class="fa-solid fa-id-badge text-theme-beige-500"></i>
                        Nombre
                    </label>
                    <input 
                        type="text" 
                        name="first_name" 
                        id="first_name"
                        value="{{ datos.first_name|default:'' }}"
                        required
                        placeholder="Ej. Juan"
                        class="w-full px-4 py-3 bg-theme-black-950 border border-theme-black-700 rounded-xl text-theme-beige-100 placeholder:text-theme-beige-300/30 outline-none focus:bg-theme-black-950 focus:border-theme-beige-500 focus:ring-4 focus:ring-theme-beige-500/20 transition-all text-sm"
                    >
                </div>

                <!-- Campo: Apellido -->
                <div class="space-y-1.5">
                    <label for="last_name" class="text-xs font-medium text-theme-beige-300/70 flex items-center gap-2 ml-1">
                        <i class="fa-solid fa-id-badge text-theme-beige-500"></i>
                        Apellido
                    </label>
                    <input 
                        type="text" 
                        name="last_name" 
                        id="last_name"
                        value="{{ datos.last_name|default:'' }}"
                        required
                        placeholder="Ej. Pérez"
                        class="w-full px-4 py-3 bg-theme-black-950 border border-theme-black-700 rounded-xl text-theme-beige-100 placeholder:text-theme-beige-300/30 outline-none focus:bg-theme-black-950 focus:border-theme-beige-500 focus:ring-4 focus:ring-theme-beige-500/20 transition-all text-sm"
                    >
                </div>

                <!-- Campo: Email -->
                <div class="space-y-1.5">
                    <label for="email" class="text-xs font-medium text-theme-beige-300/70 flex items-center gap-2 ml-1">
                        <i class="fa-solid fa-envelope text-theme-beige-500"></i>
                        Correo electrónico
                    </label>
                    <input 
                        type="email" 
                        name="email" 
                        id="email"
                        value="{{ datos.email|default:'' }}"
                        required
                        placeholder="ejemplo@correo.com"
                        class="w-full px-4 py-3 bg-theme-black-950 border border-theme-black-700 rounded-xl text-theme-beige-100 placeholder:text-theme-beige-300/30 outline-none focus:bg-theme-black-950 focus:border-theme-beige-500 focus:ring-4 focus:ring-theme-beige-500/20 transition-all text-sm"
                    >
                </div>

                <!-- Campo: Contraseña -->
                <div class="space-y-1.5">
                    <label for="password1" class="text-xs font-medium text-theme-beige-300/70 flex items-center gap-2 ml-1">
                        <i class="fa-solid fa-lock text-theme-beige-500"></i>
                        Contraseña
                    </label>
                    <input 
                        type="password"
                        name="password1"
                        id="password1"
                        required
                        placeholder="••••••••"
                        class="w-full px-4 py-3 bg-theme-black-950 border border-theme-black-700 rounded-xl text-theme-beige-100 placeholder:text-theme-beige-300/30 outline-none focus:bg-theme-black-950 focus:border-theme-beige-500 focus:ring-4 focus:ring-theme-beige-500/20 transition-all text-sm"
                    >
                </div>

                <!-- Campo: Confirmar contraseña -->
                <div class="space-y-1.5">
                    <label for="password2" class="text-xs font-medium text-theme-beige-300/70 flex items-center gap-2 ml-1">
                        <i class="fa-solid fa-lock text-theme-beige-500"></i>
                        Confirmar contraseña
                    </label>
                    <input 
                        type="password"
                        name="password2"
                        id="password2"
                        required
                        placeholder="••••••••"
                        class="w-full px-4 py-3 bg-theme-black-950 border border-theme-black-700 rounded-xl text-theme-beige-100 placeholder:text-theme-beige-300/30 outline-none focus:bg-theme-black-950 focus:border-theme-beige-500 focus:ring-4 focus:ring-theme-beige-500/20 transition-all text-sm"
                    >
                </div>

                <!-- Botón de submit -->
                <button type="submit" 
                        class="btn-primary w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 bg-theme-beige-500 text-theme-black-950 text-sm font-semibold rounded-xl shadow-[0_0_20px_-8px_rgba(212,196,168,0.4)] hover:shadow-[0_0_30px_-6px_rgba(212,196,168,0.6)] hover:bg-theme-beige-300 focus:outline-none focus:ring-4 focus:ring-theme-beige-500/30 transition-all mt-4">
                    <i class="fa-solid fa-user-plus"></i>
                    Crear cuenta
                </button>
            </form>

            <!-- Enlace a login -->
            <div class="mt-8 text-center text-sm text-theme-beige-300/70 border-t border-theme-black-800 pt-6">
                ¿Ya tienes cuenta? 
                <a href="{% url 'login' %}" class="font-medium text-theme-beige-500 hover:text-theme-beige-300 transition-colors ml-1">
                    Inicia sesión
                </a>
            </div>
        </div>

        <!-- Pie de página sutil -->
        <div class="mt-8 text-xs text-theme-beige-300/30 text-center pb-4">
            <span>© 2026 — Panel interno de gestión</span>
        </div>
    </main>

</body>
</html>
