{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'theme-black': {
                950: '#050505',
                900: '#121212',
                800: '#1f1f1f',
                700: '#2e2e2e',
              },
              'theme-beige': {
                500: '#d4c4a8',
                300: '#e8ddc8',
                100: '#fdfbf7',
              },
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-theme-black-950 text-theme-beige-100 font-['Space_Grotesk'] relative flex flex-col items-center justify-start py-12 px-4 sm:px-6">

    <!-- Filtro SVG Oculto para teñir el logo -->
    <svg class="hidden">
        <filter id="rimuru-beige">
            <feColorMatrix type="matrix" values="
            0 0 0 0 0.831
            0 0 0 0 0.768
            0 0 0 0 0.658
            -0.333 -0.333 -0.333 0 1
            " />
        </filter>
    </svg>

    <!-- Luces de fondo sutiles fijas -->
    <div class="pointer-events-none fixed -top-40 -left-32 w-[32rem] h-[32rem] bg-theme-beige-500/5 rounded-full blur-[120px]"></div>
    <div class="pointer-events-none fixed top-1/3 -right-40 w-[28rem] h-[28rem] bg-theme-black-700/20 rounded-full blur-[120px]"></div>
    <div class="pointer-events-none fixed bottom-0 left-1/4 w-[26rem] h-[26rem] bg-theme-beige-500/5 rounded-full blur-[130px]"></div>

    <!-- Textura sutil de grano -->
    <div class="pointer-events-none fixed inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(212,196,168,0.03)_1px,transparent_0)] bg-[size:24px_24px]"></div>

    <main class="w-full max-w-md relative z-10 my-auto">

        <!-- Contenedor de la marca -->
        <div class="flex justify-center mb-8">
            <div class="w-24 h-24 rounded-2xl bg-theme-black-900 shadow-[0_0_35px_-5px_rgba(212,196,168,0.2)] flex items-center justify-center border border-theme-beige-500/30 overflow-hidden">
                <img src="{% static 'img/logo.png' %}" 
                    alt="Rimuru Logo" 
                    class="w-full h-full object-cover scale-110 opacity-90 hover:opacity-100 transition-opacity"
                    style="filter: url(#rimuru-beige);">
            </div>
        </div>

        <!-- tarjeta de cristal -->
        <div class="rounded-3xl bg-theme-black-900/80 backdrop-blur-2xl border border-theme-black-800 shadow-2xl shadow-black/80 px-8 py-10 sm:px-10">

            <h1 class="text-2xl text-theme-beige-100 font-medium text-center">
                Bienvenido de vuelta
            </h1>
            <p class="mt-2 text-sm text-theme-beige-300/70 text-center">
                Ingresa tus credenciales para continuar
            </p>

            {% if form.errors %}
            <div class="mt-6 rounded-xl border border-theme-black-700 bg-theme-black-800 text-theme-beige-300 text-sm px-4 py-3 text-center">
                Usuario o contraseña incorrectos
            </div>
            {% endif %}

            <form action="{% url 'login' %}" method="post" class="mt-8 space-y-5">
                {% csrf_token %}

                <div>
                    <label for="username" class="block text-xs text-theme-beige-300/70 mb-2 ml-1">
                        Usuario
                    </label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        placeholder="Nombre de usuario"
                        required
                        autofocus
                        value="{{ form.username.value|default:'' }}"
                        class="w-full rounded-xl bg-theme-black-950 border border-theme-black-700 px-4 py-3 text-theme-beige-100 placeholder:text-theme-beige-300/30 outline-none focus:bg-theme-black-950 focus:border-theme-beige-500 focus:ring-4 focus:ring-theme-beige-500/20 transition-all text-sm"
                    >
                </div>

                <div>
                    <label for="password" class="block text-xs text-theme-beige-300/70 mb-2 ml-1">
                        Contraseña
                    </label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        class="w-full rounded-xl bg-theme-black-950 border border-theme-black-700 px-4 py-3 text-theme-beige-100 placeholder:text-theme-beige-300/30 outline-none focus:bg-theme-black-950 focus:border-theme-beige-500 focus:ring-4 focus:ring-theme-beige-500/20 transition-all text-sm"
                    >
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center gap-2 text-theme-beige-300/70 cursor-pointer">
                        <input type="checkbox" name="remember" class="w-3.5 h-3.5 rounded bg-theme-black-950 border-theme-black-700 text-theme-beige-500 focus:ring-theme-beige-500/40 focus:ring-offset-theme-black-900 focus:ring-offset-2">
                        Recordarme
                    </label>
                    <a href="#" class="text-theme-beige-300/50 hover:text-theme-beige-500 transition-colors">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <button
                    type="submit"
                    class="w-full rounded-xl bg-theme-beige-500 text-theme-black-950 py-3 text-sm font-medium shadow-[0_0_20px_-8px_rgba(212,196,168,0.4)] hover:shadow-[0_0_30px_-6px_rgba(212,196,168,0.6)] hover:bg-theme-beige-300 focus:outline-none focus:ring-4 focus:ring-theme-beige-500/30 transition-all"
                >
                    Iniciar sesión
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-theme-black-800 text-center">
                <p class="text-sm text-theme-beige-300/70">
                    ¿No tienes una cuenta? 
                    <a href="{% url 'registro' %}" class="text-theme-beige-500 hover:text-theme-beige-300 font-medium transition-colors ml-1">
                        Crear cuenta
                    </a>
                </p>
            </div>
            
        </div> 

        <p class="mt-8 text-center text-xs text-theme-beige-300/30 pb-4">
            © 2026 — Panel interno de gestión
        </p>
    </main>

</body>
</html>
