<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tarea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body {
            background: #f8fafc;
        }
        .form-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .form-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
        }
        /* Estilo para los campos del formulario */
        input, select {
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        input:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 font-sans antialiased">

    <div class="w-full max-w-2xl bg-white/70 backdrop-blur-sm rounded-3xl shadow-xl p-6 md:p-10 border border-white/40">

        <!-- Cabecera -->
        <div class="flex items-center gap-3 mb-8 border-b border-slate-200/80 pb-5">
            <div class="bg-indigo-100 p-3 rounded-xl text-indigo-600 shadow-sm border border-indigo-200/50">
                <i class="fa-solid fa-list-check text-xl"></i>
            </div>
            <div class="flex-1">
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">
                     Nueva Tarea
                </h1>
                <p class="text-sm text-slate-500 font-light mt-1">
                    Agregar tarea a: <span class="font-semibold text-indigo-600">{{ proyecto.nombre }}</span>
                </p>
            </div>
        </div>

        <!-- Formulario para crear tarea -->
        <div class="form-card bg-white rounded-2xl p-6 md:p-8 border border-slate-100 shadow-sm">
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <!-- Campo: Título -->
                <div class="space-y-1.5">
                    <label for="titulo" class="flex items-center gap-2 text-sm font-semibold text-slate-700">
                        <i class="fa-solid fa-t text-indigo-400"></i>
                        Título de la tarea
                    </label>
                    <input type="text" 
                           name="titulo" 
                           id="titulo" 
                           placeholder="Ej. Diseñar una base de datos" 
                           required
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder:text-slate-400 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all duration-150" />
                </div>

                <!-- Contenedor en cuadrícula para Prioridad y Estado (se apilan en móviles, lado a lado en desktop) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- Campo: Prioridad -->
                    <div class="space-y-1.5">
                        <label for="prioridad" class="flex items-center gap-2 text-sm font-semibold text-slate-700">
                            <i class="fa-solid fa-flag text-indigo-400"></i>
                            Prioridad
                        </label>
                        <div class="relative">
                            <select name="prioridad" 
                                    id="prioridad"
                                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all duration-150 appearance-none cursor-pointer">
                                {% for valor, etiqueta in prioridad_choices %}
                                    <option value="{{ valor }}" {% if valor == 'MEDIA' %} selected {% endif %}>
                                        {{ etiqueta }}
                                    </option>
                                {% endfor %}
                            </select>
                            <!-- Icono de flecha para el select -->
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Campo: Estado -->
                    <div class="space-y-1.5">
                        <label for="estado" class="flex items-center gap-2 text-sm font-semibold text-slate-700">
                            <i class="fa-solid fa-bars-progress text-indigo-400"></i>
                            Estado
                        </label>
                        <div class="relative">
                            <select name="estado" 
                                    id="estado"
                                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 transition-all duration-150 appearance-none cursor-pointer">
                                {% for valor, etiqueta in estado_choices %}
                                    <option value="{{ valor }}" {% if valor == 'PENDIENTE' %} selected {% endif %}>
                                        {{ etiqueta }}
                                    </option>
                                {% endfor %}
                            </select>
                            <!-- Icono de flecha para el select -->
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Acciones del formulario -->
                <div class="pt-4 flex flex-col sm:flex-row items-center justify-start gap-3 border-t border-slate-100">
                    <button type="submit" 
                            class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-indigo-600 text-white text-sm font-medium rounded-xl hover:bg-indigo-700 transition-all duration-150 shadow-md hover:shadow-lg focus:ring-2 focus:ring-indigo-300 focus:ring-offset-2">
                        <i class="fa-solid fa-circle-check"></i>
                        Guardar Tarea
                    </button>
                    <!-- Agregué un botón de "Cancelar" usando javascript puro para no inventar una url de django, 
                         esto respetando que querías dejar los enlaces intactos pero manteniendo la armonía de la UI -->
                    <button type="button" 
                            onclick="window.history.back();"
                            class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-slate-100 text-slate-600 text-sm font-medium rounded-xl hover:bg-slate-200 transition-all duration-150 border border-slate-200/60">
                        <i class="fa-solid fa-circle-xmark"></i>
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
        
    </div>

</body>
</html>
