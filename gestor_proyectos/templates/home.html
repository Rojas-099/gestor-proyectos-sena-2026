<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Proyectos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Noto Sans JP', sans-serif; }
  .font-impact { font-family: 'Anton', sans-serif; }
  .font-bangers { font-family: 'Bangers', cursive; }
</style>
</head>
<body class="bg-[#050b1a] text-white overflow-hidden">

<div class="relative min-h-screen w-full flex items-center justify-center">

  <!-- Ambient magic glow -->
  <div class="pointer-events-none absolute -top-32 -left-24 h-96 w-96 rounded-full bg-cyan-500/10 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-32 -right-24 h-96 w-96 rounded-full bg-fuchsia-600/10 blur-3xl"></div>

  <!-- Kanji watermarks -->
  <span class="font-bangers pointer-events-none select-none absolute top-10 left-6 sm:left-16 text-[6rem] sm:text-[8rem] leading-none text-cyan-400/5">転生</span>
  <span class="font-bangers pointer-events-none select-none absolute bottom-10 right-6 sm:right-16 text-[6rem] sm:text-[8rem] leading-none text-fuchsia-500/5">魔王</span>
  <span class="font-bangers pointer-events-none select-none absolute top-1/2 right-4 -translate-y-1/2 text-[10rem] sm:text-[13rem] leading-none text-cyan-400/[0.04] rotate-6">竜</span>

  <!-- Content -->
  <div class="relative z-10 mx-6 text-center">

    <div class="flex items-center justify-center gap-3 mb-5">
      <span class="h-px w-8 bg-cyan-400/50"></span>
      <p class="text-cyan-400 text-xs tracking-[0.3em] uppercase">プロジェクト・マネージャー</p>
      <span class="h-px w-8 bg-cyan-400/50"></span>
    </div>

    <h1 class="font-impact text-4xl sm:text-6xl tracking-tight text-white uppercase mb-2">
      Bienvenido a
    </h1>
    <h1 class="font-impact text-4xl sm:text-6xl tracking-tight text-cyan-300 uppercase mb-6">
      Gestor de Proyectos
    </h1>

    <p class="text-sm sm:text-base text-cyan-100/50 tracking-wide mb-8">
      Tu próxima aventura de equipo empieza ahora.
    </p>

    <!-- Botón de llamada a la acción -->
    <a href="{% url 'proyectos' %}"
       class="inline-block px-8 py-3 mb-8 font-impact text-sm sm:text-base tracking-widest uppercase text-[#050b1a] bg-cyan-300 rounded-md shadow-[0_0_25px_rgba(34,211,238,0.4)] hover:bg-cyan-200 hover:shadow-[0_0_35px_rgba(34,211,238,0.6)] transition-all duration-200">
      Comenzar aventura
    </a>

    <div class="flex items-center justify-center gap-2 text-cyan-400/40 text-xs tracking-[0.2em] uppercase">
      <span class="h-1.5 w-1.5 rounded-full bg-cyan-400"></span>
      <span>Nivel 1 · Slime Rango</span>
    </div>

  </div>

</div>

</body>
</html>
