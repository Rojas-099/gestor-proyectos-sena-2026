{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Proyectos</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'theme-black': {
            950: '#050505',
            900: '#121212',
            800: '#1f1f1f',
            700: '#2e2e2e',
          },
          'theme-beige': {
            500: '#d4c4a8',
            300: '#e8ddc8',
            100: '#fdfbf7',
          },
        }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Noto Sans JP', sans-serif; }
  .font-impact { font-family: 'Anton', sans-serif; }
  .font-bangers { font-family: 'Bangers', cursive; }
</style>
</head>
<body class="bg-theme-black-950 text-theme-beige-100 overflow-hidden">

<!-- Filtro SVG Oculto para teñir el logo -->
<svg class="hidden">
  <filter id="rimuru-beige">
    <feColorMatrix type="matrix" values="
      0 0 0 0 0.831
      0 0 0 0 0.768
      0 0 0 0 0.658
      -0.333 -0.333 -0.333 0 1
    " />
  </filter>
</svg>

<div class="relative min-h-screen w-full flex items-center justify-center">

  <!-- Sombras sutiles -->
  <div class="pointer-events-none absolute -top-32 -left-24 h-96 w-96 rounded-full bg-theme-beige-500/5 blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-32 -right-24 h-96 w-96 rounded-full bg-theme-black-700/30 blur-3xl"></div>

  <!-- Marcas de agua -->
  <span class="pointer-events-none select-none absolute top-10 left-6 sm:left-16 text-[6rem] sm:text-[8rem] leading-none text-theme-beige-500/5">転生</span>
  <span class="pointer-events-none select-none absolute bottom-10 right-6 sm:right-16 text-[6rem] sm:text-[8rem] leading-none text-theme-beige-500/5">魔王</span>
  <span class="pointer-events-none select-none absolute top-1/2 right-4 -translate-y-1/2 text-[10rem] sm:text-[13rem] leading-none text-theme-beige-500/[0.02] rotate-6">竜</span>

  <!-- Contenido Principal -->
  <div class="relative z-10 mx-6 text-center">

    <!-- Logo agregado aquí -->
    <div class="flex justify-center mb-6">
        <div class="w-24 h-24 rounded-2xl bg-theme-black-900 shadow-[0_0_35px_-5px_rgba(212,196,168,0.2)] flex items-center justify-center border border-theme-beige-500/30 overflow-hidden">
            <img src="{% static 'img/logo.png' %}" 
                alt="Logo del Proyecto" 
                class="w-full h-full object-cover scale-110 opacity-90 hover:opacity-100 transition-opacity"
                style="filter: url(#rimuru-beige);">
        </div>
    </div>

    <!-- Subtítulo Japonés -->
    <div class="flex items-center justify-center gap-3 mb-5">
      <span class="h-px w-8 bg-theme-beige-500/30"></span>
      <p class="text-theme-beige-300 text-xs tracking-[0.3em] uppercase">プロジェクト・マネージャー</p>
      <span class="h-px w-8 bg-theme-beige-500/30"></span>
    </div>

    <h1 class="text-4xl sm:text-6xl font-light tracking-tight text-theme-beige-100 uppercase mb-2">
      Bienvenido a
    </h1>
    <h1 class="text-4xl sm:text-6xl font-medium tracking-tight text-theme-beige-500 uppercase mb-6">
      Gestor de Proyectos
    </h1>

    <p class="text-sm sm:text-base text-theme-beige-300/70 tracking-wide mb-8">
      Tu próxima aventura de equipo empieza ahora.
    </p>

    <!-- Botón de llamada a la acción -->
    <a href="{% url 'proyectos' %}"
       class="inline-block px-8 py-3 mb-10 text-sm sm:text-base font-medium tracking-widest uppercase text-theme-black-950 bg-theme-beige-500 rounded-md shadow-[0_0_20px_rgba(212,196,168,0.15)] hover:bg-theme-beige-300 hover:shadow-[0_0_30px_rgba(212,196,168,0.3)] transition-all duration-300">
      Comenzar aventura
    </a>

    <!-- Créditos -->
    <div class="flex flex-col items-center justify-center gap-1 text-theme-beige-300/50 text-xs tracking-[0.2em] uppercase">
      <span class="h-1.5 w-1.5 rounded-full bg-theme-beige-500 mb-2"></span>
      <span>Gestión de Procesos</span>
      <span class="text-[0.65rem] opacity-60 mt-1">By Nicolas Rojas</span>
    </div>

  </div>

</div>

</body>
</html>
