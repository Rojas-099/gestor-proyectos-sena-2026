<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Nuevo Proyecto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'theme-black': {
                950: '#050505',
                900: '#121212',
                800: '#1f1f1f',
                700: '#2e2e2e',
              },
              'theme-beige': {
                500: '#d4c4a8',
                300: '#e8ddc8',
                100: '#fdfbf7',
              },
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        body {
            background: #050505;
        }
        .form-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .form-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }
        /* Estilo para los campos del formulario con el nuevo acento beige */
        input, textarea {
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        input:focus, textarea:focus {
            border-color: #d4c4a8;
            box-shadow: 0 0 0 3px rgba(212, 196, 168, 0.15);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 font-sans antialiased bg-theme-black-950 text-theme-beige-100">

    <div class="w-full max-w-2xl bg-theme-black-900/80 backdrop-blur-sm rounded-3xl shadow-2xl shadow-black/50 p-6 md:p-10 border border-theme-black-800">

        <!-- Cabecera con navegación simple -->
        <div class="flex items-center gap-3 mb-8 border-b border-theme-black-800 pb-5">
            <div class="bg-theme-black-800 p-3 rounded-xl text-theme-beige-500 border border-theme-black-700">
                <!-- Ícono corregido -->
                <i class="fa-solid fa-circle-plus text-2xl"></i>
            </div>
            <div class="flex-1">
                <h1 class="text-2xl md:text-3xl font-bold text-theme-beige-100 tracking-tight">
                    Nuevo Proyecto
                </h1>
                <p class="text-sm text-theme-beige-300/70 font-light">
                    Completa los campos para crear un nuevo proyecto
                </p>
            </div>
            <!-- Enlace para volver a la lista -->
            <a href="{% url 'proyectos' %}" 
               class="inline-flex items-center gap-1.5 px-4 py-2 bg-theme-black-800 text-theme-beige-300 text-sm font-medium rounded-xl border border-theme-black-700 hover:bg-theme-black-700 hover:text-theme-beige-100 transition-all duration-150 shadow-sm">
                <!-- Ícono corregido -->
                <i class="fa-solid fa-arrow-left"></i>
                <span class="hidden sm:inline">Volver</span>
            </a>
        </div>

        <!-- Formulario para crear proyecto -->
        <div class="form-card bg-theme-black-950/50 rounded-2xl p-6 md:p-8 border border-theme-black-800 shadow-sm">
            <form method="post" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}

                <!-- Campo: Nombre -->
                <div class="space-y-1.5">
                    <label for="id_nombre" class="flex items-center gap-2 text-sm font-semibold text-theme-beige-100">
                        <!-- Ícono corregido -->
                        <i class="fa-solid fa-tag text-theme-beige-500 text-xs"></i>
                        Nombre del proyecto
                    </label>
                    <input type="text" 
                           name="nombre" 
                           id="id_nombre" 
                           required
                           placeholder="Ej: Desarrollo E-commerce"
                           class="w-full px-4 py-3 bg-theme-black-900 border border-theme-black-700 rounded-xl text-theme-beige-100 placeholder:text-theme-beige-300/40 text-sm focus:border-theme-beige-500 focus:ring-2 focus:ring-theme-beige-500/20 transition-all duration-150" />
                </div>

                <!-- Campo: Descripción -->
                <div class="space-y-1.5">
                    <label for="id_descripcion" class="flex items-center gap-2 text-sm font-semibold text-theme-beige-100">
                        <!-- Ícono corregido -->
                        <i class="fa-solid fa-align-left text-theme-beige-500 text-xs"></i>
                        Descripción
                    </label>
                    <textarea name="descripcion" 
                              id="id_descripcion" 
                              rows="4"
                              required
                              placeholder="Describe el objetivo y alcance del proyecto..."
                              class="w-full px-4 py-3 bg-theme-black-900 border border-theme-black-700 rounded-xl text-theme-beige-100 placeholder:text-theme-beige-300/40 text-sm focus:border-theme-beige-500 focus:ring-2 focus:ring-theme-beige-500/20 transition-all duration-150 resize-y"></textarea>
                    <p class="text-xs text-theme-beige-300/50 mt-1">Máximo 500 caracteres</p>
                </div>

                <!-- Campo: Duración -->
                <div class="space-y-1.5">
                    <label for="id_duracion" class="flex items-center gap-2 text-sm font-semibold text-theme-beige-100">
                        <!-- Ícono corregido -->
                        <i class="fa-solid fa-clock text-theme-beige-500 text-xs"></i>
                        Duración estimada
                    </label>
                    <input type="number" 
                           name="duracion" 
                           id="id_duracion" 
                           required
                           placeholder="Ej: 3 meses, 12 semanas, 45 días"
                           class="w-full px-4 py-3 bg-theme-black-900 border border-theme-black-700 rounded-xl text-theme-beige-100 placeholder:text-theme-beige-300/40 text-sm focus:border-theme-beige-500 focus:ring-2 focus:ring-theme-beige-500/20 transition-all duration-150" />

                </div>

                <!-- Campo: Imagen -->
                <div class="space-y-1.5">
                    <label for="id_imagen" class="flex items-center gap-2 text-sm font-semibold text-theme-beige-100">
                        <!-- Ícono corregido -->
                        <i class="fa-solid fa-image text-theme-beige-500 text-xs"></i>
                        Imagen
                    </label>
                    <input type="file" 
                           name="imagen" 
                           id="id_imagen" 
                           required
                           class="w-full px-4 py-3 bg-theme-black-900 border border-theme-black-700 rounded-xl text-theme-beige-100 placeholder:text-theme-beige-300/40 text-sm focus:border-theme-beige-500 focus:ring-2 focus:ring-theme-beige-500/20 transition-all duration-150 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-theme-beige-500 file:text-theme-black-950 hover:file:bg-theme-beige-300" />
                </div>

                <!-- Acciones del formulario -->
                <div class="pt-4 flex flex-col sm:flex-row items-center gap-3 border-t border-theme-black-800">
                    <button type="submit" 
                            class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-theme-beige-500 text-theme-black-950 text-sm font-medium rounded-xl hover:bg-theme-beige-300 transition-all duration-150 shadow-md focus:ring-2 focus:ring-theme-beige-500/50 focus:ring-offset-2 focus:ring-offset-theme-black-950">
                        <!-- Ícono corregido -->
                        <i class="fa-solid fa-circle-check"></i>
                        Guardar
                    </button>
                    <a href="{% url 'proyectos' %}"
                       class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-theme-black-800 text-theme-beige-300/70 text-sm font-medium rounded-xl hover:bg-theme-black-700 hover:text-theme-beige-100 transition-all duration-150 border border-theme-black-700">
                        <!-- Ícono corregido -->
                        <i class="fa-solid fa-circle-xmark"></i>
                        Cancelar
                    </a>
                </div>
            </form>
        </div>

        
        
    </div>

</body>
</html>
